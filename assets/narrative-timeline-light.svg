  </g>
  <g font-size="13" fill="#59636E" text-anchor="middle">
    <text x="120" y="124">ER-1</text>
    <text x="360" y="124">Skeptic</text>
    <text x="600" y="124"><tspan fill="#534AB7" font-weight="600">Activation Probes</tspan> · now</text>
  </g>
